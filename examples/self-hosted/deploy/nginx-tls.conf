# Install inside nginx's http context. Replace hostname and mount private TLS files.
log_format borecount_selfhost_safe escape=json '{"requestId":"$request_id","status":$status,"durationSeconds":$request_time}';
server {
  listen 443 ssl;
  server_name ledger.example.org;
  ssl_certificate /run/secrets/tls-fullchain.pem;
  ssl_certificate_key /run/secrets/tls-private-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 1048576;
  client_body_timeout 15s;
  access_log /var/log/nginx/borecount-access.log borecount_selfhost_safe;
  error_log /dev/null;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    add_header X-Request-Id $request_id always;
    return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"Request body is too large"}';
  }
  location ~ ^/(metrics|health|ready)$ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header X-Request-Id $request_id;
  }
  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
