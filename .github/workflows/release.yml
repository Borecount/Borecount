name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm
        required: true
        default: false
        type: boolean
      npm-tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Verify and pack release
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must run from main.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Setup Node and npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata
        run: bun run release:verify

      - name: Run unit, type, lint, and contract checks
        run: |
          bun run test:unit
          bun run typecheck
          bun run lint
          bun run contract:verify

      - name: Build packages
        run: bun run build

      - name: Pack and install release artifacts
        run: bun run pack:verify

      - name: Record package-specific release manifest
        run: bun run release:verify --manifest .tmp/package-smoke/tarballs/release-manifest.json

      - name: Upload installable package tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: borecount-package-tarballs
          path: .tmp/package-smoke/tarballs/
          if-no-files-found: error

  database:
    name: Verify PostgreSQL release path
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://luxledger:luxledger@127.0.0.1:5432/luxledger_test
      DATABASE_URL_TEST: postgresql://luxledger:luxledger@127.0.0.1:5432/luxledger_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luxledger
          POSTGRES_PASSWORD: luxledger
          POSTGRES_DB: luxledger_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxledger -d luxledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must run from main.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run PostgreSQL integration tests
        run: bun run test:integration

      - name: Verify migration and restore
        run: bun run migration:verify

  publish:
    name: Publish packages
    if: inputs.publish
    needs:
      - dry-run
      - database
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Setup Node and npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download verified package tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: borecount-package-tarballs
          path: .tmp/release-tarballs

      - name: Publish missing package versions and smoke test npm artifacts
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: bun run scripts/publish-release.ts --manifest .tmp/release-tarballs/release-manifest.json --tag "$NPM_TAG"
